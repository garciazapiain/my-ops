# App-of-apps: every Application manifest in argocd/apps/ is created and kept in sync by this one.
# Bootstrap once with: kubectl apply -n argocd -f argocd/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/garciazapiain/my-ops.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
