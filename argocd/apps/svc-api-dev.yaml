# svc-api in dev: render charts/service with apps/svc-api/dev.yaml and keep the cluster in sync with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: svc-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/garciazapiain/my-ops.git
    targetRevision: main
    path: charts/service
    helm:
      releaseName: svc-api
      valueFiles:
        - ../../apps/svc-api/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: svc-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
